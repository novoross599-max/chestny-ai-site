name: Build and deploy to Beget

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beget-production
  cancel-in-progress: false

jobs:
  build:
    name: Build Astro site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Verify build output
        run: test -f dist/index.html

      - name: Store build artifact
        uses: actions/upload-artifact@v7
        with:
          name: chestny-ai-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Beget
    needs: build
    if: ${{ vars.BEGET_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: beget-production

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Install transfer client
        run: sudo apt-get update && sudo apt-get install --yes lftp

      - name: Upload dist securely
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SFTP_KNOWN_HOSTS: ${{ vars.SFTP_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          if [[ -z "$FTP_SERVER" || -z "$FTP_USERNAME" || -z "$FTP_PASSWORD" ]]; then
            echo "Required Beget secrets are not configured." >&2
            exit 1
          fi

          case "$FTP_SERVER" in
            sftp://*)
              if [[ -z "$SFTP_KNOWN_HOSTS" ]]; then
                echo "SFTP_KNOWN_HOSTS must contain the verified Beget SSH host-key line." >&2
                exit 1
              fi
              install -d -m 700 "$HOME/.ssh"
              printf '%s\n' "$SFTP_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
              chmod 600 "$HOME/.ssh/known_hosts"
              target="$FTP_SERVER"
              protocol_settings="set sftp:auto-confirm no;"
              ;;
            ftps://*)
              target="ftp://${FTP_SERVER#ftps://}"
              protocol_settings="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate true;"
              ;;
            *)
              echo "FTP_SERVER must start with sftp:// or ftps://; unencrypted FTP is refused." >&2
              exit 1
              ;;
          esac

          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$target" -e "
            set cmd:fail-exit true;
            set net:max-retries 2;
            set net:timeout 20;
            $protocol_settings
            mirror --reverse --verbose --parallel=2 dist/ /;
            bye
          "
